name: Release Candidate (immutable gate)

# MW-95-02: an immutable release-candidate gate that CANNOT report green when the
# authenticated journeys were skipped.
#
# The ordinary CI workflow (ci.yml) stays usable day to day: a missing seeded
# environment is tolerated on a normal push, and its release gate depends on the
# mutable repository variable RC_GATE. That variable is too easy to leave unset —
# an RC could go green having checked nothing.
#
# This workflow removes that failure mode. It runs ONLY for an explicit release
# candidate — a manual dispatch naming the exact SHA, or a signed `rc/*` tag — and
# for those runs the authenticated E2E matrix is REQUIRED. Missing seeded secrets
# or zero discovered tests FAIL the run, with no dependence on RC_GATE. It never
# uses live Stripe or a production Supabase.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-char commit SHA to certify as the release candidate"
        required: true
        type: string
  push:
    tags:
      - "rc/*"

# Least privilege: this workflow only reads the repo and writes its own run
# artifacts. It needs no write access to contents, packages or deployments.
permissions:
  contents: read

concurrency:
  group: rc-${{ github.event.inputs.candidate_sha || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Certify release candidate
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders only. The non-production guard below refuses to
      # proceed if any of these resolve to a live/production indicator.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      # MW-V18-02: pin the PREVIEW/TEST application URL, never the production
      # public URL. The RC serves a locally built app to Playwright (see
      # playwright.config webServer), so the app URL is the throwaway test origin.
      # An operator can override with a preview deployment via E2E_APP_URL.
      NEXT_PUBLIC_APP_URL: ${{ secrets.E2E_APP_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_rc_placeholder
    steps:
      - name: Resolve candidate ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.candidate_sha }}"
            if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error title=Bad candidate SHA::candidate_sha must be a full 40-character commit SHA."
              exit 1
            fi
          else
            REF="${{ github.sha }}"
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Certify the EXACT commit, and fetch full history so the manifest's
          # drift/migration checks and any rcSha..HEAD diff resolve.
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 0

      # Fail closed if the environment looks like production or live billing.
      # A release candidate must be certified against throwaway fixtures only.
      - name: Non-production guard (refuse live Stripe / production Supabase)
        env:
          E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        run: |
          fail=0
          case "$E2E_STRIPE_SECRET_KEY" in
            sk_live_*)
              echo "::error title=Live Stripe refused::E2E_STRIPE_SECRET_KEY is a LIVE key. The RC gate runs in Stripe TEST mode only."
              fail=1 ;;
          esac
          # A production Supabase project ref must never be the RC target.
          case "$E2E_SUPABASE_URL" in
            *prod*|*production*)
              echo "::error title=Production Supabase refused::E2E_SUPABASE_URL looks like a production project."
              fail=1 ;;
          esac
          # MW-V18-02: the non-production RC must not point at the production
          # public origin. If someone sets E2E_APP_URL to the live domain, stop.
          case "$NEXT_PUBLIC_APP_URL" in
            https://mellowa.app|https://www.mellowa.app|https://mellowa.app/*)
              echo "::error title=Production URL refused::NEXT_PUBLIC_APP_URL is the live public origin. A non-production RC must use a preview/test URL."
              fail=1 ;;
          esac
          if [ "$fail" = "1" ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Release-truth first: the manifest must be internally consistent before
      # any suite result could be recorded against it.
      - name: Validate release manifest
        run: npm run release-manifest

      - name: Status page is in sync with the manifest
        run: node scripts/render-release-status.mjs docs/release/manifest.v16.json --check

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit / contract / safety
        run: npm run test
      - name: Eval gate
        run: npm run eval
      - name: Production build
        run: npm run build
      - name: Public browser journeys
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:public

      # The load-bearing difference from ci.yml: for an RC the authenticated
      # matrix is REQUIRED. Missing seeded secrets fail the run outright, with no
      # dependence on the mutable RC_GATE variable.
      #
      # MW-V17-01 preflight: verify EVERY GitHub secret the canonical runtime
      # contract needs is present, and that the Stripe key is a TEST key, BEFORE
      # any seed/test runs. It reports only the NAMES of missing variables, never
      # a value. The canonical secret→runtime mapping is asserted by
      # tests/env-contract-parity.test.ts and lives in scripts/e2e-env-contract.mjs.
      - name: Preflight — require the canonical seeded environment
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
        run: |
          missing=""
          for name in E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_SUPABASE_SERVICE_ROLE_KEY E2E_TEST_USER_EMAIL E2E_TEST_USER_PASSWORD E2E_STRIPE_SECRET_KEY; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=RC gate::Authenticated E2E cannot run — missing required secret(s):$missing. A release candidate MUST run it; this run fails closed. (Names only; no values are ever printed.)"
            exit 1
          fi
          # Require a Stripe TEST key. Empty is already caught above; a non-test
          # key (live or malformed) must fail closed rather than reach checkout.
          case "$E2E_STRIPE_SECRET_KEY" in
            sk_test_*) : ;;
            *)
              echo "::error title=RC gate::E2E_STRIPE_SECRET_KEY must be a Stripe TEST key (sk_test_…). The RC checkout journey never touches live billing."
              exit 1 ;;
          esac

      - name: Authenticated E2E matrix (required)
        env:
          # GitHub secret → canonical runtime name (the ONLY place the secret
          # names differ from the runtime names the runner/seeder/harness read).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          # The runner, harness and seeder all gate on this explicit flag.
          E2E_SUPABASE_TEST: "1"
          # Force the fail-closed matrix runner regardless of the mutable var.
          RC_GATE: "1"
        # MW-V18-02: run the authenticated matrix ONCE. The bare `npm run test:e2e`
        # was removed because it re-ran the same authenticated specs the matrix
        # runner drives (and could exit 0 with everything skipped). The matrix
        # runner is the authoritative auth journey: it seeds each fixture, runs
        # every required journey across every viewport, FAILS on zero discovered
        # tests, and writes SHA-pinned evidence the freeze step verifies.
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:matrix

      # MW-V18-02: record what THIS run actually executed. Reaching this step under
      # `set -e` proves every required suite above passed in this run; the emitter
      # writes a run summary (code gates + the authenticated matrix, with its
      # SHA-pinned evidence path). release-check is deliberately absent — a
      # non-production run never claims production owner evidence.
      - name: Emit RC run summary
        run: |
          node scripts/emit-rc-run-summary.mjs \
            --out /tmp/rc-run-summary.json \
            --sha "${{ steps.ref.outputs.sha }}" \
            --auth-evidence "docs/release/evidence/v13/auth-matrix/${{ steps.ref.outputs.sha }}.json"

      # MW-V17-02 + MW-V18-02: freeze a COMPUTED, SHA-pinned candidate from the run
      # summary — never the unchanged draft manifest, never a blanket mark-green.
      # freeze records a suite as passing ONLY from the step that executed it in
      # this run (via the summary), re-verifies the authenticated matrix against
      # its own evidence (non-zero passed, zero failed, exact SHA), and REFUSES to
      # mark the production-only release-check. GITHUB_RUN_ID makes provenance
      # "workflow" and manifestValid true (the manifest was validated in the first
      # step). It refuses to freeze a SHA other than the checked-out HEAD and
      # writes an immutable artifact; it needs no write permission (contents: read)
      # — the artifact is uploaded, not committed. Promotion into the tracked
      # manifest is a separate reviewed step (scripts/promote-candidate.mjs).
      - name: Freeze the candidate record
        run: node scripts/freeze-candidate.mjs --run-summary /tmp/rc-run-summary.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ steps.ref.outputs.sha }}
          path: |
            docs/release/evidence/v17/candidate/${{ steps.ref.outputs.sha }}.json
            docs/release/manifest.v16.json
            docs/release/v16/STATUS.md
          if-no-files-found: warn
