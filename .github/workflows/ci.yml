name: CI

# MW-V9-00: make missing tests visible on every PR and on protected main.
# Authenticated Playwright E2E is environment-aware: it runs only when a seeded
# test-user environment is present and is otherwise reported as SKIPPED (never
# silently green). A release candidate must treat that skip as non-green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# MW-V18-07 least privilege: CI only reads the repo and runs checks. It needs no
# write access to contents, packages, deployments or id-tokens.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Placeholder build-time env. The server env accessors are lazy getters,
      # so `next build` succeeds without real secrets. These values are NOT
      # used for any live provider call in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # Must be https so the SEO/sitemap invariant (tests/seo-pwa.test.ts)
      # matches production. The public E2E server still binds to localhost via
      # Playwright's own baseURL, independent of this value.
      NEXT_PUBLIC_APP_URL: https://mellowa.app
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: tests/release-manifest.test.ts diffs the frozen v13 RC
          # commit (940cb94) against HEAD. The default shallow clone omits it, so
          # the diff fails with "bad object" and the whole job goes red.
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit / contract / safety / eval suite
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Public browser journeys
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:public

  authenticated-e2e:
    name: Authenticated E2E (env-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check for seeded test-user environment
        id: env
        run: |
          if [ -n "${{ secrets.E2E_TEST_USER_EMAIL }}" ] && [ -n "${{ secrets.E2E_SUPABASE_URL }}" ]; then
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            echo "status=ran" >> "$GITHUB_OUTPUT"
          else
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            echo "status=SKIPPED (not green)" >> "$GITHUB_OUTPUT"
            echo "::warning title=Authenticated E2E skipped::No seeded test-user environment configured. This job is NOT green for a release candidate — see docs/BUILD_STATE.md."
          fi
          # MW-V10-00: make the skip legible in the run summary rather than
          # only in an annotation nobody re-reads at sign-off time.
          {
            echo "### Authenticated E2E"
            if [ "${{ secrets.E2E_TEST_USER_EMAIL }}" = "" ]; then
              echo "**SKIPPED — no seeded test-user environment.**"
              echo "This job reporting success does NOT mean the authenticated"
              echo "journeys passed. A release candidate must treat this as a"
              echo "non-green, blocking gate."
            else
              echo "Ran against the seeded environment."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.env.outputs.seeded == 'true'
        run: npm ci
      - if: steps.env.outputs.seeded == 'true'
        env:
          # MW-V17-01: same canonical secret → runtime mapping as the RC gate, so
          # the runner/seeder/harness see the names they actually read. Advisory
          # here (this job only runs when the seed secrets exist); the RC workflow
          # is the fail-closed gate.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          E2E_SUPABASE_TEST: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
          # MW-V12-02: the matrix runner seeds every fixture and blocks if any
          # required journey never ran. Under RC_GATE it fails closed; on an
          # ordinary push it is advisory. It writes SHA-pinned evidence.
          RC_GATE="${{ vars.RC_GATE }}" npm run test:e2e:matrix

      # The release-candidate gate. On an ordinary push a missing seeded env is
      # tolerated so day-to-day CI stays usable; when the owner sets the
      # RC_GATE repository variable to 1 for a release candidate, an unrun
      # authenticated suite fails the run instead of passing quietly. Without
      # this, "all checks green" on an RC means only that nothing was checked.
      - name: Release-candidate gate
        if: steps.env.outputs.seeded != 'true' && vars.RC_GATE == '1'
        run: |
          echo "::error title=RC gate::Authenticated E2E did not run, so this commit cannot be a release candidate. Configure the seeded test-user secrets or clear RC_GATE."
          exit 1
